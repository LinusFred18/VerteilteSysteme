version: "3.8"

services:
  nameservice:
    build:
      context: .
      dockerfile: docker/nameservice.Dockerfile
    ports:
      - "50051:50051"
    networks:
      - taskgrid

  dispatcher:
    build:
      context: .
      dockerfile: docker/dispatcher.Dockerfile
    ports:
      - "50052:50052"
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-reverse:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=reverse
        - PORT=50060
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-sum:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=sum
        - PORT=50061
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-hash:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=hash
        - PORT=50062
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-upper:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=upper
        - PORT=50063
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-wait:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=wait
        - PORT=50064
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

      
  worker-length:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=length
        - PORT=50065
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-average:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=average
        - PORT=50066
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-lower:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=lower
        - PORT=50067
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  worker-prime:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        - WORKER_TYPE=prime
        - PORT=50068
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
    depends_on:
      - nameservice
    networks:
      - taskgrid

  monitoring:
    build:
      context: .
      dockerfile: docker/monitoring.Dockerfile
    ports:
      - "50053:50053"
      - "8080:8080"
    environment:
      - NAMESERVICE_ADDRESS=nameservice:50051
      - DISPATCHER_ADDRESS=dispatcher:50052
    depends_on:
      - nameservice
      - dispatcher
    networks:
      - taskgrid

  test-client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    environment:
      - DISPATCHER_ADDRESS=dispatcher:50052
    depends_on:
      - dispatcher
      - worker-reverse
      - worker-sum
      - worker-hash
      - worker-upper
      - worker-wait
    networks:
      - taskgrid

networks:
  taskgrid:
    driver: bridge
