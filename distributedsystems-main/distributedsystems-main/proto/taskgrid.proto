syntax = "proto3";

package taskgrid;

// Task message definition
message Task {
    int32 id = 1;
    string type = 2;
    string payload = 3;
    string result = 4;
    string status = 5;
    int64 timestamp_created = 6;
    int64 timestamp_completed = 7;
}

// Client Service
service ClientService {
    rpc SendTask (SendTaskRequest) returns (SendTaskResponse);
    rpc RequestResult (RequestResultRequest) returns (RequestResultResponse);
}

message SendTaskRequest {
    string type = 1;
    string payload = 2;
}

message SendTaskResponse {
    int32 task_id = 1;
}

message RequestResultRequest {
    int32 task_id = 1;
}

message RequestResultResponse {
    Task task = 1;
}

// Worker Service
service WorkerService {
    rpc ProcessTask (Task) returns (ProcessTaskResponse);
}

message ProcessTaskResponse {
    string result = 1;
    bool success = 2;
}

// Nameservice Service
service NameService {
    rpc RegisterWorker (RegisterWorkerRequest) returns (RegisterWorkerResponse);
    rpc LookupWorker (LookupWorkerRequest) returns (LookupWorkerResponse);
    rpc DeregisterWorker (DeregisterWorkerRequest) returns (DeregisterWorkerResponse);
}

message RegisterWorkerRequest {
    string type = 1;
    string address = 2;
}

message RegisterWorkerResponse {
    bool success = 1;
}

message LookupWorkerRequest {
    string type = 1;
}

message LookupWorkerResponse {
    string address = 1;
}

message DeregisterWorkerRequest {
    string address = 1;
}

message DeregisterWorkerResponse {
    bool success = 1;
}

// Monitoring Service
service MonitoringService {
    rpc GetSystemStats (SystemStatsRequest) returns (SystemStatsResponse);
}

message SystemStatsRequest {}

message SystemStatsResponse {
    int32 active_workers = 1;
    int32 pending_tasks = 2;
    double avg_processing_time = 3;
} 